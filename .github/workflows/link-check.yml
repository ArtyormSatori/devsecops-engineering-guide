# Link rot is the main way a resource list decays. This catches it early.
name: Link check

on:
  push:
    branches: [main]
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    # Weekly — links break without anyone touching the repo
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to file an issue when the scheduled run finds breakage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --retry-wait-time 5
            --max-retries 2
            --accept 200,206,403,429
            --exclude-path assets/
            './**/*.md'
          output: lychee-report.md
          fail: false # report, do not block PRs on a flaky third-party host

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lychee-report
          path: lychee-report.md

      # Only nag on the scheduled run — a broken link on someone's PR is
      # usually not their fault and should not block their contribution.
      - name: Open an issue if the scheduled run found broken links
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Broken links detected (automated weekly check)"
          content-filepath: lychee-report.md
          labels: |
            broken-link
            good first issue
