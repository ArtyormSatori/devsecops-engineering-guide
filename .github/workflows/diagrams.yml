# The SVGs are generated, not hand-written. This catches a PR that edits the
# SVG directly (which would be silently overwritten on the next regeneration)
# or edits the generator without committing the output.
name: Diagrams

on:
  pull_request:
    paths:
      - "assets/generate_diagrams.py"
      - "assets/*.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-generated:
    name: Diagrams match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate SVGs
        run: python3 assets/generate_diagrams.py

      - name: Fail if the committed SVGs are stale
        run: |
          if ! git diff --quiet -- assets/*.svg; then
            echo "::error::Committed SVGs differ from generator output."
            echo "Run: python3 assets/generate_diagrams.py --png"
            git diff --stat -- assets/*.svg
            exit 1
          fi
          echo "SVGs are up to date."
